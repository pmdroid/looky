specVersion: "0.1"
description: An independent review of the diff must pass before a pull request.
retry:
  maxFailedAttemptsPerItem: 3
  scope: task
  maxFailedReviewAttempts: 4
items:
  - id: independent-review
    kind: review
    gate: beforePR
    skill: .agents/skills/review/SKILL.md
    independence:
      differentSession: true
      differentModel: true
    failOn: P1
    scope: diff
